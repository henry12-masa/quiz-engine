<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>歴史クイズ</title>
<meta name="description" content="歴史クイズ">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1 id="title">歴史クイズ</h1>
  <p id="desc">好きなクイズを選んで挑戦しよう</p>
</header>

<nav id="menu"></nav>

<div class="layout">

  <main class="quiz-box">

    <div class="status">
      <span id="count">読み込み中...</span>
      <span id="score">スコア:0</span>
    </div>

    <div class="progress">
      <div id="bar"></div>
    </div>

    <h2 id="question">
      問題を読み込んでいます...
    </h2>

    <div id="choices"></div>

    <p id="result"></p>

  </main>

  <aside class="ad-side">

    <p>スポンサーリンク</p>

    <script async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8398161859137802"
      crossorigin="anonymous">
    </script>

    <ins class="adsbygoogle"
      style="display:block"
      data-ad-client="ca-pub-8398161859137802"
      data-ad-slot="5599163841"
      data-ad-format="auto"
      data-full-width-responsive="true">
    </ins>

    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>

  </aside>

</div>



<!-- その後にscript.js -->
<script src="script.js"></script>

</body>
</html>
