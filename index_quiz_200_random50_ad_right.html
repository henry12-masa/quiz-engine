<style>
*{box-sizing:border-box}
body{
  font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  margin:0;background:#f4f7fb;color:#222;
}
header{
  background:linear-gradient(135deg,#111827,#334155);
  color:#fff;padding:24px 16px;text-align:center;
}
header h1{margin:0 0 8px;font-size:32px}
header p{margin:0;opacity:.9}
nav{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  padding:14px;background:white;box-shadow:0 2px 8px rgba(0,0,0,.05);
}
nav a{
  padding:10px 15px;border-radius:999px;background:#e5e7eb;
  color:#111;text-decoration:none;font-weight:bold;
}
nav a.active{background:#2563eb;color:#fff}
.layout{
  max-width:1180px;margin:28px auto;padding:0 16px;
  display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;
}
.quiz-box{
  background:#fff;padding:26px;border-radius:20px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}
.status{display:flex;justify-content:space-between;gap:10px;font-weight:bold;margin-bottom:14px}
.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:22px}
#bar{height:100%;width:0;background:#22c55e;transition:.25s}
#question{font-size:26px;line-height:1.5;margin:0 0 22px}
#choices{display:grid;gap:12px}
#choices button,.finish button{
  width:100%;padding:16px;font-size:18px;border:0;border-radius:12px;
  background:#f1f5f9;cursor:pointer;font-weight:bold;
}
#choices button:hover,.finish button:hover{background:#dbeafe}
.correct{background:#86efac!important}
.wrong{background:#fca5a5!important}
#result{min-height:28px;font-size:18px;font-weight:bold;margin-top:18px}
.ad-side{
  background:#fff;border-radius:18px;padding:16px;text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
  position:sticky;top:16px;min-height:320px;
}
.ad-side p{margin:0 0 12px;color:#64748b;font-size:13px}
.finish{text-align:center;font-size:24px;font-weight:bold;line-height:1.8}
.small{font-size:14px;color:#64748b;margin-top:10px}
@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .ad-side{position:static}
  header h1{font-size:26px}
  #question{font-size:22px}
}
</style>
</head>

document.querySelector('meta[name="description"]').content = info.desc;
document.getElementById("title").textContent = info.title;

document.getElementById("menu").innerHTML = `
  <a href="/?type=all" class="${TYPE==="all"?"active":""}">総合</a>
  <a href="/?type=history" class="${TYPE==="history"?"active":""}">歴史</a>
  <a href="/?type=sengoku" class="${TYPE==="sengoku"?"active":""}">戦国</a>
  <a href="/?type=castle" class="${TYPE==="castle"?"active":""}">城</a>
`;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

const QUESTION_LIMIT = 50;
let questions = shuffle([...sourceQuestions]).slice(0, QUESTION_LIMIT);
let current = 0;
let score = 0;
let locked = false;

function escapeForAttr(str){
  return String(str).replace(/&/g,"&amp;").replace(/'/g,"&#39;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function showQuestion(){
  locked = false;
  document.getElementById("result").textContent = "";

  if(current >= questions.length){
    showFinish();
    return;
  }

  const q = questions[current];
  document.getElementById("count").textContent = `${current+1}/${questions.length}`;
  document.getElementById("score").textContent = `スコア:${score}`;
  document.getElementById("bar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("question").textContent = q.q;

  document.getElementById("choices").innerHTML = shuffle([...q.c]).map(choice => `
    <button onclick="answer(this,'${escapeForAttr(choice)}')">${choice}</button>
  `).join("");
}

function answer(btn, choice){
  if(locked) return;
  locked = true;

  const q = questions[current];
  const buttons = document.querySelectorAll("#choices button");

  buttons.forEach(b=>{
    b.disabled = true;
    if(b.textContent.trim() === q.a) b.classList.add("correct");
  });

  if(choice === q.a){
    score++;
    btn.classList.add("correct");
    document.getElementById("result").textContent = "正解！";
  }else{
    btn.classList.add("wrong");
    document.getElementById("result").textContent = `不正解。正解は「${q.a}」`;
  }

  document.getElementById("score").textContent = `スコア:${score}`;

  setTimeout(()=>{
    current++;
    showQuestion();
  }, 1200);
}

function showFinish(){
  document.getElementById("bar").style.width = "100%";
  document.getElementById("count").textContent = "終了";
  document.getElementById("question").textContent = "結果発表";
  document.getElementById("choices").innerHTML = `
    <div class="finish">
      <div>${questions.length}問中 ${score}問 正解！</div>
      <div class="small">もう一度遊ぶと、ランダムで別の50問が出ます。</div>
      <button onclick="location.reload()">もう一度挑戦する</button>
    </div>
  `;
  document.getElementById("result").textContent = "";
}

showQuestion();
